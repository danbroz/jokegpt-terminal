<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JokeGPT.net</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #input-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }

        #subjectInput {
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            width: 100%;
        }

        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        #terminal {
            margin-top: 20px;
            width: 100%;
            max-width: 500px;
        }

        .xterm-viewport {
            overflow-y: hidden !important;
        }
    </style>
</head>
<body>
    <h1>JokeGPT.net <img src="https://i.ibb.co/k5Gpg6r/1626590-emoji-emoticons-happy-laugh-laughing-icon128px.png" border="0" height="32" width="32"></h1>
    <div id="input-container">
        <input type="text" id="subjectInput" placeholder="Enter subject to joke about">
        <button onclick="submitSubject()">Write comedy</button>
    </div>
    <p>By <a href="http://danbroz.com">Daniel Broz</a> and ChatGPT</p>
    <div id="terminal"></div>

    <script>
        function wrapText(text, maxLength) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                if (currentLine.length + words[i].length + 1 <= maxLength) {
                    currentLine += ' ' + words[i];
                } else {
                    lines.push(currentLine);
                    currentLine = words[i];
                }
            }
            lines.push(currentLine);

            return lines.join('\n');
        }

        const term = new Terminal({ convertEol: true, scrollback: 0 });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        const socket = new WebSocket('wss://jokegpt.net');

        socket.onopen = () => {
            socket.onmessage = (event) => {
                const wrappedText = wrapText(event.data, 40); // 50 is just an example value
                term.write(wrappedText);
            };
        };

        function submitSubject() {
            term.clear();
            const subject = document.getElementById('subjectInput').value;
            socket.send(subject);
        }

        window.addEventListener('resize', () => {
            fitAddon.fit();
        });
    </script>
</body>
</html>
