<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
<center>
<img src="https://i.ibb.co/k5Gpg6r/1626590-emoji-emoticons-happy-laugh-laughing-icon128px.png" border="0">
<h1>JokeGPT.net</h1>
<label for="subject">Subject to joke about:</label>
<input type="text" id="subject" name="subject">
<button onclick="generateJokes()">Generate Jokes</button>
<br>may take up to 10 seconds

<pre id="jokesOutput"></pre>

<script>
    async function generateJokes() {
        const subject = document.getElementById("subject").value;
        const response = await fetch('/generate-jokes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ subject: subject }),
        });
        
        const data = await response.text();
        document.getElementById("jokesOutput").textContent = data;
    }
</script>

</html>
